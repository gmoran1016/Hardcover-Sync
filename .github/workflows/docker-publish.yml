name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m compileall -q .
      - run: python -m unittest discover -v
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker build -t hardcover-sync:test .
      - name: Verify container entrypoint logs
        run: |
          docker run --rm hardcover-sync:test python -u main.py --help \
            > container.log 2>&1
          cat container.log
          grep -F "[hardcover-sync-entrypoint] container starting" container.log
          grep -F "[hardcover-sync-entrypoint] virtual display is ready" container.log
          grep -F "usage:" container.log
      - name: Verify Chrome renders an offline local page
        run: docker run --rm hardcover-sync:test python -u browser_smoke.py
      - name: Save the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save --output hardcover-sync-test.tar hardcover-sync:test
      - name: Upload the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hardcover-sync-test-image
          path: hardcover-sync-test.tar
          retention-days: 1

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    steps:
      - name: Download the tested image
        uses: actions/download-artifact@v8.0.2
        with:
          name: hardcover-sync-test-image
      - name: Load the tested image
        run: docker load --input hardcover-sync-test.tar
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/hardcover-sync
        run: |
          docker tag hardcover-sync:test "$IMAGE:latest"
          docker tag hardcover-sync:test "$IMAGE:sha-${GITHUB_SHA}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-${GITHUB_SHA}"
